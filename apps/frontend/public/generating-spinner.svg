    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="19" fill="none" stroke="#94a3b8" stroke-opacity="0.18" stroke-width="5" />
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 24 24" to="360 24 24"
